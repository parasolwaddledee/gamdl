name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Rust tests
        run: |
          PYO3_PYTHON=python cargo test --manifest-path gamdl_cn/downloader/ammuxer/Cargo.toml

      - name: Verify lock file
        run: uv lock --check

      - name: Build native extension
        run: |
          uv run --locked maturin develop

      - name: Verify CLI
        run: |
          uv run --locked gamdl --version
          uv run --locked gamdl_cn --version
          uv run --locked gamdl_queue --help
          uv run --locked gamdl_pipeline --help
          uv run --locked gamdl_service --help

      - name: Verify Compose deployment template
        run: GAMDL_ENV_FILE=./gamdl/gamdl.env.example docker compose -f deploy/compose.yaml config --quiet

      - name: Python tests
        run: |
          uv run --locked python -m unittest discover -s tests
