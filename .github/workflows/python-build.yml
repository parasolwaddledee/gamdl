name: Build Python distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build source distribution
        run: |
          python -m pip install "maturin==1.14.1"
          maturin sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  build-wheels:
    name: Build wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            python-version: "3.10"
            args: ""
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            python-version: "3.10"
            args: ""
          - name: windows-x86_64
            os: windows-latest
            python-version: "3.10"
            args: ""
          - name: windows-arm64
            os: windows-11-arm
            python-version: "3.12"
            args: ""
          - name: macos-universal2
            os: macos-latest
            python-version: "3.10"
            args: "--target universal2-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS universal2 Rust target
        if: matrix.name == 'macos-universal2'
        run: rustup target add x86_64-apple-darwin

      - name: Build wheel
        run: |
          python -m pip install "maturin==1.14.1"
          maturin build --release --out dist ${{ matrix.args }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/
