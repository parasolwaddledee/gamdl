[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "gamdl_cn"
version = "3.8.5+cn"
description = "A China-focused downstream of gamdl with localized metadata and enhanced lyrics support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "async-lru>=2.0.5",
    "click>=8.3.0",
    "colorama>=0.4.6",
    "dataclass-click>=1.0.4",
    "gamdl==3.8.5",
    "httpx>=0.28.1",
    "httpx-retries>=0.4.6",
    "inquirerpy>=0.3.4",
    "m3u8>=6.0.0",
    "mutagen>=1.47.0",
    "pillow>=12.0.0",
    "pywidevine>=1.8.0",
    "structlog>=25.5.0",
    "yt-dlp>=2025.10.22",
]

[project.urls]
Repository = "https://github.com/parasolwaddledee/gamdl"
Upstream = "https://github.com/glomatico/gamdl"

[project.scripts]
gamdl_cn = "gamdl_cn.cli.cli:main"
gamdl_queue = "gamdl_cn.automation.queue:main"
gamdl_pipeline = "gamdl_cn.automation.pipeline:main"
gamdl_service = "gamdl_cn.automation.service:main"

[dependency-groups]
dev = [
    "maturin>=1.8",
]

[tool.maturin]
manifest-path = "gamdl_cn/downloader/ammuxer/Cargo.toml"
module-name = "gamdl_cn._ammuxer"
python-source = "."
features = ["pyo3/extension-module"]
include = ["LICENSE"]
exclude = ["**/target/**"]
