name: gamdl-playlist

services:
  pipeline:
    image: ${GAMDL_IMAGE:-gamdl-dual:latest}
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      GAMDL_COOKIES_PATH: /config/cookies.txt
      RCLONE_CONFIG: /config/rclone.conf
      RCLONE_DESTINATION: ${RCLONE_DESTINATION:-music:music}
      GAMDL_RUN_INTERVAL: ${GAMDL_RUN_INTERVAL:-1h}
      GAMDL_RUN_IMMEDIATELY: ${GAMDL_RUN_IMMEDIATELY:-true}
      GAMDL_RUN_ONCE: ${GAMDL_RUN_ONCE:-false}
      GAMDL_KEEP_LOCAL: ${GAMDL_KEEP_LOCAL:-false}
      GAMDL_DRY_RUN: ${GAMDL_DRY_RUN:-false}
      GAMDL_QUEUES: ${GAMDL_QUEUES:-us,cn}
      GAMDL_US_PLAYLIST: ${GAMDL_US_PLAYLIST:-US_Pending}
      GAMDL_CN_PLAYLIST: ${GAMDL_CN_PLAYLIST:-CN_Pending}
      GAMDL_DOWNLOAD_TIMEOUT: ${GAMDL_DOWNLOAD_TIMEOUT:-3600}
      GAMDL_VERIFY_ATTEMPTS: ${GAMDL_VERIFY_ATTEMPTS:-6}
      GAMDL_VERIFY_DELAY: ${GAMDL_VERIFY_DELAY:-3}
    volumes:
      - type: bind
        source: ${GAMDL_COOKIES_FILE:?Set GAMDL_COOKIES_FILE in .env}
        target: /config/cookies.txt
        read_only: true
      - type: bind
        source: ${RCLONE_CONFIG_FILE:?Set RCLONE_CONFIG_FILE in .env}
        target: /config/rclone.conf
        read_only: true
      - type: volume
        source: downloads
        target: /downloads
      - type: bind
        source: ${GAMDL_STATE_DIR:-./.gamdl/playlist-queue}
        target: /state
    tmpfs:
      - /tmp

volumes:
  downloads:
